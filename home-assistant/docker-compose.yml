services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      # Maps your HA configuration to a local folder so data persists across reboots
      - ./ha_config:/config
      # Syncs the container time with your Pi's system time (crucial for automations)
      - /etc/localtime:/etc/localtime:ro
      # Exposes the Pi's Bluetooth hardware to Home Assistant
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  music-assistant:
    container_name: music-assistant
    image: "ghcr.io/music-assistant/server:latest"
    volumes:
      # Maps the Music Assistant database and settings
      - ./ma_data:/data
    restart: unless-stopped
    # Host network is required for discovering Wi-Fi speakers and mDNS broadcasting
    network_mode: host
  
  po-token-server:
    container_name: po-token-server
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    ports:
      - "4416:4416"

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ~/docker/mosquitto/config:/mosquitto/config
      - ~/docker/mosquitto/data:/mosquitto/data
      - ~/docker/mosquitto/log:/mosquitto/log
    restart: unless-stopped
    # Since HA is using 'host' network mode, exposing Mosquitto's ports 
    # to the host allows HA to reach it via the host's IP address.

  ruview-densepose:
    container_name: ruview-densepose
    image: ruvnet/wifi-densepose:latest
    restart: unless-stopped
    environment:
      - RUVIEW_ALLOW_UNAUTHENTICATED=1
      - RUVIEW_BIND_ADDR=0.0.0.0
      - RUVIEW_UDP_BIND=0.0.0.0
      - RUVIEW_UDP_ALLOW=198.162.1.0/24
      - RUVIEW_ALLOWED_HOSTS=*
      - SENSING_ALLOWED_HOSTS=*
    command:
      - "--bind"
      - "0.0.0.0:3000"
      - "--allowed-host"
      - "*"
      - "--udp-allow"
      - "198.162.1.0/24"
    ports:
      - "3001:3000"
      - "5005:5005/udp"
    volumes:
      - ./ruview-densepose_data:/data